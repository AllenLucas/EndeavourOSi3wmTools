[package]
name = "arch-tools-desktop"
version = "0.2.0"
edition = "2024"
description = "Tauri desktop shell for Arch display and wallpaper tools"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arch-tools = { path = ".." }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
